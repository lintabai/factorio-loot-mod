[technology-description]
loot-rarity-1=Crafted entities can now roll Magic rarity with up to 1 prefix and 1 suffix.
loot-rarity-2=Crafted entities can now roll Rare rarity with up to 2 prefixes and 2 suffixes.
loot-rarity-3=Crafted entities can now roll Epic rarity with up to 3 prefixes and 3 suffixes.
loot-rarity-4=Crafted entities can now roll Legendary rarity. The pinnacle — and the most dangerous to reroll.
loot-forge=Unlocks the Tinkerer's Forge. Place it to reroll item affixes using currency orbs.
loot-orbs-1=Unlocks basic orb crafting: Transmutation, Alteration, Alchemy, Scouring.
loot-orbs-2=Unlocks advanced orb crafting: Chaos, Augmentation, Annulment.
loot-orbs-3=Unlocks rare orb crafting: Exaltation, Blessed.
loot-affixes-1=Unlocks resource-specific affixes on assembling machines (iron, copper, fluid modifiers).
loot-affixes-2=Unlocks entity-specific affixes for assemblers, labs, poles, inserters, and armor.
loot-affixes-3=Unlocks the full affix pool including Legendary-only modifiers.
loot-lab-affixes=Unlocks science-type-specific affixes for laboratories.
loot-armor-affixes=Unlocks affix rolling for armor and power armor, including Lucky/Cursed modifiers.

