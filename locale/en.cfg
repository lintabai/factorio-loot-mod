[item-description]
loot-tinkerers-forge=Place this building to craft a Tinkerer's Forge.
loot-orb-transmutation=Upgrades a Normal item to Magic rarity, rolling 1 prefix and 1 suffix.
loot-orb-alteration=Rerolls all affixes on a Magic item.
loot-orb-alchemy=Upgrades a Normal item to Rare rarity, rolling 2 prefixes and 2 suffixes.
loot-orb-chaos=Rerolls all affixes on a Rare item. Destruction chance: 15%.
loot-orb-augmentation=Adds one affix to an item that has an open affix slot.
loot-orb-annulment=Removes one random affix from an item.
loot-orb-scouring=Strips all affixes. The item becomes Normal with no modifiers.
loot-orb-exaltation=Adds one affix to a Rare or higher item with an open slot. Destruction chance applies.
loot-orb-blessed=Rerolls the values of all affixes without changing which affixes are present.

